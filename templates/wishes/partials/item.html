<article class="item" id="item-{{ item.pk }}"><div><strong>{{ item.name }}</strong>{% if item.price %}<span>${{ item.price }}</span>{% endif %}{% if item.notes %}<p>{{ item.notes }}</p>{% endif %}{% if item.url %}<a href="{{ item.url }}" target="_blank" rel="noopener">View item</a>{% endif %}</div><form hx-post="{% url 'wishes:claim_item' item.pk %}" hx-target="#item-{{ item.pk }}" hx-swap="outerHTML" method="post">{% csrf_token %}{% if not item.claimed %}<input name="claimed_by" placeholder="Your name" aria-label="Your name"><button>Claim secretly</button>{% else %}<span class="claimed">Claimed by another shopper</span><button>Release</button>{% endif %}</form></article>
