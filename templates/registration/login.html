{% extends "base.html" %}
{% block title %}Log in | Wish List Tracker{% endblock %}
{% block content %}
<section>
  <p class="eyebrow">Welcome back</p>
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button" type="submit">Log in</button>
  </form>
  <p>Need an account? <a href="{% url 'wishes:signup' %}">Sign up</a>.</p>
</section>
{% endblock %}
